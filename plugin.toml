[plugin]
id = "neko_rimworld"
name = "N.E.K.O RimWorld"
version = "1.0.0"
type = "plugin"
entry = "plugin.plugins.neko_rimworld:NekoRimworldPlugin"
description = "Independent memoryless RimWorld research agent with a read-only local game bridge."
short_description = "Ask an independent RimWorld specialist to inspect the current colony."
keywords = ["rimworld", "colony", "game", "advisor", "consult", "analysis"]

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.4.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "RimWorld Bridge"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "dashboard"
permissions = ["state:read", "config:write", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false
timeout = 10
startup_failure = "warn"

[neko_rimworld]
port = 48919
pairing_token = ""
diagnostic_log_capacity = 200

[neko_rimworld.agent]
base_url = ""
model = ""
api_key = ""
request_timeout_seconds = 60.0
connect_timeout_seconds = 10.0
first_response_timeout_seconds = 45.0
stream_idle_timeout_seconds = 20.0
finalization_reserve_seconds = 15.0
stream_include_usage = true
run_budget_seconds = 90.0
preferred_cycles = 4
review_before_delivery = false
max_output_tokens = 32768
temperature = 0.2

# Static discovery metadata: Hosted UI validates these without importing plugin code.

[[entries]]
id = "get_agent_run_details"
name = "Read retained agent run"
description = "Hosted UI access to one retained run and a bounded page of audit events."
timeout = 5.0
llm_result_fields = []
metadata = { "agent_auto" = false }
input_schema = { "type" = "object", "properties" = { "run_id" = { "type" = "string", "minLength" = 1, "maxLength" = 128 }, "event_offset" = { "type" = "integer", "minimum" = 0, "maximum" = 512 }, "event_limit" = { "type" = "integer", "minimum" = 1, "maximum" = 100 } }, "required" = ["run_id"], "additionalProperties" = false }

[[entries]]
id = "probe_game_overview"
name = "Probe RimWorld game overview"
description = "Request the colony overview section from the authenticated local RimWorld session."
timeout = 5.0
llm_result_fields = ["summary"]
metadata = { "agent_auto" = false }
input_schema = { "type" = "object", "properties" = {  } }

[[entries]]
id = "rimworld_consult"
name = "Consult RimWorld specialist"
description = "Ask the plugin-owned, memoryless RimWorld specialist agent to answer a question. Use for RimWorld game-state questions or locally indexed game/Mod definition knowledge. Optionally attach an exact report_id from rimworld_report to ask about a saved historical report."
timeout = 100.0
llm_result_fields = ["summary"]
metadata = { "llm_result_fields" = ["summary"] }
input_schema = { "type" = "object", "properties" = { "question" = { "type" = "string", "minLength" = 1, "maxLength" = 2000, "description" = "The user's RimWorld question, preserving their language and intent." }, "report_id" = { "type" = "string", "pattern" = "^[0-9a-f]{32}$", "description" = "Optional exact report ID to explicitly attach; omitted means a fresh consultation." } }, "required" = ["question"], "additionalProperties" = false }

[[entries]]
id = "rimworld_report"
name = "Retrieve RimWorld reports"
description = "List saved full RimWorld reports or read one exact report_id. Read returns the full report and silently exports it to the host run when available. For analysis of its details use rimworld_consult(question, report_id); reports are historical, not current game state."
timeout = 8.0
llm_result_fields = ["summary"]
metadata = { "llm_result_fields" = ["summary"] }
input_schema = { "type" = "object", "properties" = { "action" = { "type" = "string", "enum" = ["list", "read"] }, "report_id" = { "type" = "string", "pattern" = "^[0-9a-f]{32}$" }, "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 1000 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 20 } }, "required" = ["action"], "additionalProperties" = false }

[[entries]]
id = "save_agent_settings"
name = "Save RimWorld research agent settings"
description = "Hosted UI configuration action for the plugin-owned model client."
timeout = 15.0
llm_result_fields = ["summary"]
metadata = { "agent_auto" = false }
input_schema = { "type" = "object", "properties" = { "base_url" = { "type" = "string", "minLength" = 1, "maxLength" = 2048 }, "model" = { "type" = "string", "minLength" = 1, "maxLength" = 256 }, "api_key" = { "type" = "string", "writeOnly" = true, "maxLength" = 4096, "description" = "Leave empty to retain the currently configured API key." }, "ui_nonce" = { "type" = "string", "writeOnly" = true, "minLength" = 1 }, "budgets" = { "type" = "object", "additionalProperties" = false, "properties" = { "connect_timeout_seconds" = { "type" = "number", "minimum" = 1, "maximum" = 30 }, "first_response_timeout_seconds" = { "type" = "number", "minimum" = 1, "maximum" = 60 }, "stream_idle_timeout_seconds" = { "type" = "number", "minimum" = 1, "maximum" = 60 }, "request_timeout_seconds" = { "type" = "number", "minimum" = 3, "maximum" = 60 }, "run_budget_seconds" = { "type" = "number", "minimum" = 10, "maximum" = 90 }, "finalization_reserve_seconds" = { "type" = "number", "minimum" = 0, "maximum" = 30 }, "max_output_tokens" = { "type" = "integer", "minimum" = 64, "maximum" = 131072 } } } }, "required" = ["base_url", "model", "api_key", "ui_nonce"], "additionalProperties" = false }

[[entries]]
id = "save_bridge_settings"
name = "Save RimWorld bridge settings"
description = "Save local bridge credentials and immediately restart the loopback listener."
timeout = 15.0
llm_result_fields = ["summary"]
metadata = { "agent_auto" = false }
input_schema = { "type" = "object", "properties" = { "port" = { "type" = "integer", "minimum" = 1, "maximum" = 65535 }, "pairing_token" = { "type" = "string", "writeOnly" = true, "maxLength" = 128, "description" = "Leave empty to retain the currently configured token." }, "ui_nonce" = { "type" = "string", "writeOnly" = true, "minLength" = 1 } }, "required" = ["port", "pairing_token", "ui_nonce"], "additionalProperties" = false }
