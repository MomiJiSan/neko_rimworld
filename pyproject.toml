[project]
name = "neko_rimworld"
version = "1.0.0"
dependencies = ["httpx>=0.28.1,<0.29"]

[tool.neko.build]
# Historical experiments are archived outside the distributable plugin.
exclude_dirs = ["evaluations", ".bench-data", ".bench-results", "rimworld-bench"]
# A Git worktree uses a .git file rather than the already excluded directory.
exclude_files = [".git"]
